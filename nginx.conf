server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the custom page whenever a request doesn't resolve to a real file.
    error_page 404 /404.html;

    # Always revalidate HTML/JS/CSS so a deploy can't be masked by a stale cache.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Never serve dotfiles or build/config artifacts, even if they
    # accidentally end up in the docroot.
    location ~ /\. {
        deny all;
    }
    location ~* \.(?:conf|ya?ml|json|map|md|lock|env)$ {
        deny all;
    }
    location = /Dockerfile {
        deny all;
    }

    location / {
        # Try the requested file, then a directory index, and otherwise fall
        # through to the custom 404 page (served with a real 404 status).
        try_files $uri $uri/ =404;
    }

    # Served only internally via error_page, never as a directly requestable
    # 200 response.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Same-origin /api → backend (avoids browser CORS on EC2 / remote hosts)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }
}
